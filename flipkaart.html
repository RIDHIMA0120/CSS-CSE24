<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flipkart Clone</title>
    <link rel="stylesheet" href="flipkaart_style.css">
</head>
<body>

    <!-- Header -->
    <header class="header">
        <div class="logo">Flipkart</div>
        <input type="text" placeholder="Search for products, brands and more">
        <button class="login-btn">Login</button>
    </header>

    <!-- Navigation -->
    <nav class="nav">
        <a href="#">Mobiles</a>
        <a href="#">Fashion</a>
        <a href="#">Electronics</a>
        <a href="#">Home</a>
        <a href="#">Appliances</a>
        <a href="#">Travel</a>
    </nav>

    <!-- Banner -->
    <section class="banner">
        <h2>Big Billion Days Sale</h2>
        <p>Best Deals on Electronics</p>
    </section>

    <!-- Products -->
    <section class="products">
        <div class="product-card">
            <img src="https://via.placeholder.com/150" alt="Product">
            <h3>Smartphone</h3>
            <p>₹12,999</p>
            <button>Buy Now</button>
        </div>

        <div class="product-card">
            <img src="https://via.placeholder.com/150" alt="Product">
            <h3>Headphones</h3>
            <p>₹1,999</p>
            <button>Buy Now</button>
        </div>

        <div class="product-card">
            <img src="https://via.placeholder.com/150" alt="Product">
            <h3>Laptop</h3>
            <p>₹49,999</p>
            <button>Buy Now</button>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <p>© 2025 Flipkart Clone | For Educational Use</p>
    </footer>

</body>
</html>
