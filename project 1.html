<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Amazon Clone</title>
  <link rel="stylesheet" href="project1_style.css" />
</head>
<body>

<!-- NAVBAR -->
<header class="navbar">
  <div class="logo">amazon</div>
  <input type="text" placeholder="Search Amazon" />
  <button>Search</button>
  <div class="nav-links">
    <span>Hello, Sign in</span>
    <span>Returns & Orders</span>
    <span>Cart 🛒</span>
  </div>
</header>

<!-- CATEGORY BAR -->
<nav class="categories">
  <span>All</span>
  <span>Today's Deals</span>
  <span>Electronics</span>
  <span>Fashion</span>
  <span>Home</span>
</nav>

<!-- HERO -->
<section class="hero">
  <h1>Welcome to Amazon</h1>
  <p>Shop deals of the day</p>
</section>

<!-- PRODUCTS -->
<section class="products">
  <div class="card">
    <h3>Electronics</h3>
    <img src="https://www.seekpng.com/png/full/774-7744281_samsung-electronics-samsung-electronic-product-png.png" />
    <button>Shop now</button>
  </div>

  <div class="card">
    <h3>Fashion</h3>
    <img src="https://image.shutterstock.com/z/stock-photo-fashion-women-stylish-accessories-outfit-glamour-set-with-label-flat-lay-beige-pastel-background-1532053424.jpg" />
    <button>Shop now</button>
  </div>

  <div class="card">
    <h3>Home & Kitchen</h3>
    <img src="https://tse2.mm.bing.net/th/id/OIP.rjKWNImo12Fh74U4-ytfGgHaEK?pid=Api&P=0&h=180" />
    <button>Shop now</button>
  </div>
</section>

<footer>
        Made with &hearts; by Amazon<br>
        &#169; 1996-2023, Amazon.com Inc. or its affiliates
</footer>

</body>
</html>
